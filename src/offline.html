<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Owlect</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --primary: #0d9488; --on-primary: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #020617; --fg: #e2e8f0; --muted: #94a3b8; --primary: #2dd4bf; --on-primary: #042f2e; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      button { border: 0; border-radius: 8px; padding: 12px 20px; background: var(--primary); color: var(--on-primary);
               font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Owlect needs an internet connection. Check your connection and try again.</p>
      <button id="retry" type="button" autofocus>Try again</button>
    </main>
    <script>
      const retry = new URLSearchParams(location.search).get("retry");
      document.getElementById("retry").addEventListener("click", () => {
        // main.ts only ever passes an app URL here; its navigation guard enforces it too.
        if (retry && /^https?:\/\//.test(retry)) location.href = retry;
      });
      window.addEventListener("online", () => retry && /^https?:\/\//.test(retry) && (location.href = retry));
    </script>
  </body>
</html>
